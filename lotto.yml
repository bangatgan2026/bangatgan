name: 로또 회차 자동 갱신

on:
  schedule:
    - cron: '30 12 * * 6'      # 매주 토요일 밤 9시 30분 (한국 시간)
    - cron: '0 1 * * 0'        # 일요일 오전 10시 (혹시 놓쳤을 때 한 번 더)
  workflow_dispatch:            # 필요하면 손으로도 실행할 수 있습니다

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 회차 받아오기
        run: node scripts/update-lotto.js
      - name: 바뀐 내용 저장
        run: |
          git config user.name  "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/draws.json assets/lotto-data.js
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "로또 회차 자동 갱신"
            git push
          fi
