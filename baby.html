<body data-section="date">

<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">아기 100일 계산기 · 돌</h1>
    <p class="page-lead">태어난 날을 넣으면 백일과 돌을 비롯한 기념일 날짜를 정리해 드립니다.</p>

    <div class="card">
      <h2>아기 정보</h2>
      <div class="field">
        <label for="birth">아기 생일 </label>
        <div class="inbox"><input id="birth" type="date" data-max="today" placeholder="" value=""></div>
      </div>
      <button class="btn" id="go">기념일 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>

      <div class="card">
        <h2>기념일 날짜</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>

      <div class="card">
        <h2>이어서 계산해 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>

  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

function run(){
  if(!U.needDate($('#birth'),'아기 생일')) return;
  var b=$('#birth').value;
  if(!b){ $('#out').hidden=true; return; }
  var bd=new Date(b); bd.setHours(0,0,0,0);
  var now=new Date(); now.setHours(0,0,0,0);
  var WD=['일','월','화','수','목','금','토'];
  var days=Math.round((now-bd)/86400000)+1;

  var d100=new Date(bd.getTime()+99*86400000);
  var left=Math.round((d100-now)/86400000);

  $('#out').hidden=false;
  $('#lab').textContent='백일';
  $('#big').textContent=d100.getFullYear()+'. '+(d100.getMonth()+1)+'. '+d100.getDate()+'.';
  $('#note').textContent=WD[d100.getDay()]+'요일입니다. '+(left>0?'백일까지 '+left+'일 남았습니다.':(left===0?'오늘이 백일입니다.':'백일이 지났습니다.'));
  $('#kpi').innerHTML=
    '<div><b>'+(days>0?days.toLocaleString()+'일째':'아직')+'</b><span>오늘로 며칠째</span></div>'+
    '<div><b>'+Math.max(0,Math.floor(days/30))+'개월</b><span>대략 개월수</span></div>'+
    '<div><b>'+WD[bd.getDay()]+'요일</b><span>태어난 요일</span></div>'+
    '<div><b>'+(left>0?'D-'+left:'지남')+'</b><span>백일까지</span></div>';

  function fmt(x){ return x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0')+' ('+WD[x.getDay()]+')'; }
  function dayMark(n){ return new Date(bd.getTime()+(n-1)*86400000); }
  function yearMark(n){ var d=new Date(bd); d.setFullYear(d.getFullYear()+n); return d; }
  var list=[['50일',dayMark(50)],['100일',dayMark(100)],['200일',dayMark(200)],
            ['돌 (첫 생일)',yearMark(1)],['두 돌',yearMark(2)],['세 돌',yearMark(3)]];
  var html='';
  list.forEach(function(p){
    var l=Math.round((p[1]-now)/86400000);
    html+='<tr><td>'+p[0]+'<div class="c">'+(l>0?'D-'+l:(l===0?'오늘':'지남'))+'</div></td><td>'+fmt(p[1])+'</td></tr>';
  });
  $('#tsub').textContent='50일과 100일, 200일은 태어난 날을 1일로 세었습니다. 돌은 같은 월일 기준입니다.';
  $('#rows').innerHTML=html;
  $('#nextTools').innerHTML=
    '<a href="birthday.html"><b>생년월일 계산기</b><span>띠와 별자리, 학교 연도까지</span></a>'+
    '<a href="dday.html"><b>디데이계산기</b><span>다른 기념일도 세어 보세요</span></a>';
  U.saveState({birth:b});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.birth){ $('#birth').value=st.birth; run(); }

})();
</script>
</body>
