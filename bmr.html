<body data-section="health">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">기초대사량 계산기</h1>
    <p class="page-lead">숨 쉬고 체온을 유지하는 데만 쓰이는 하루 최소 칼로리를 계산합니다.</p>
    <div class="card">
      <h2>신체 정보</h2>
      <div class="field">
        <label for="sex">성별 </label>
        <div class="inbox"><select id="sex"><option value="m">남성</option><option value="f">여성</option></select></div>
      </div>      <div class="row3">      <div class="field">
        <label for="age">나이 </label>
        <div class="inbox"><input id="age" inputmode="numeric" placeholder="나이"><span class="unit">세</span></div>
      </div>      <div class="field">
        <label for="h">키 </label>
        <div class="inbox"><input id="h" inputmode="numeric" placeholder="키"><span class="unit">cm</span></div>
      </div>      <div class="field">
        <label for="w">몸무게 </label>
        <div class="inbox"><input id="w" inputmode="numeric" placeholder="몸무게"><span class="unit">kg</span></div>
      </div></div>
      <button class="btn" id="go">기초대사량 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="card">
        <h2>계산 내역</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>
      <div class="card">
        <h2>이어서 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>
  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

['age','h','w'].forEach(function(id){ U.comma($('#'+id)); });
function run(){
  if(!U.need($('#age'),'나이')) return;
  if(!U.need($('#h'),'키')) return;
  if(!U.need($('#w'),'몸무게')) return;
  var sex=$('#sex').value, age=U.num($('#age')), h=U.num($('#h')), w=U.num($('#w'));
  if(!age||!h||!w){ $('#out').hidden=true; return; }
  var bmr = sex==='m'
    ? 88.362 + 13.397*w + 4.799*h - 5.677*age
    : 447.593 + 9.247*w + 3.098*h - 4.330*age;
  var levels=[['거의 안 움직임',1.2],['가벼운 활동 (주 1~3회)',1.375],
              ['보통 활동 (주 3~5회)',1.55],['활발한 활동 (주 6~7회)',1.725],['매우 활발함',1.9]];
  $('#out').hidden=false;
  $('#lab').textContent='기초대사량';
  $('#big').textContent=Math.round(bmr).toLocaleString()+' kcal';
  $('#note').textContent='아무 활동도 하지 않아도 하루에 이만큼 소모됩니다. 실제 필요 칼로리는 활동량에 따라 더 늘어납니다.';
  $('#kpi').innerHTML=
    '<div><b>'+Math.round(bmr).toLocaleString()+'</b><span>기초대사량</span></div>'+
    '<div><b>'+Math.round(bmr*1.375).toLocaleString()+'</b><span>가벼운 활동</span></div>'+
    '<div><b>'+Math.round(bmr*1.55).toLocaleString()+'</b><span>보통 활동</span></div>'+
    '<div><b>'+Math.round(bmr*1.725).toLocaleString()+'</b><span>활발한 활동</span></div>';
  $('#tsub').textContent='활동량에 따른 하루 필요 칼로리입니다.';
  var html='<tr><th>활동 수준</th><th>하루 필요 칼로리</th></tr>';
  levels.forEach(function(p){
    html+='<tr><td>'+p[0]+'</td><td>'+Math.round(bmr*p[1]).toLocaleString()+' kcal</td></tr>';
  });
  $('#rows').innerHTML=html;
  $('#nextTools').innerHTML=
    '<a href="bmi.html?h='+h+'&w='+w+'"><b>BMI 계산기</b><span>지금 넣은 값으로 바로 계산</span></a>'+
    '<a href="calorie.html?bmr='+Math.round(bmr)+'"><b>칼로리 계산기</b><span>목표 체중까지 계획 세우기</span></a>';
  U.saveState({sex:sex,age:age,h:h,w:w});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.age){ $('#sex').value=st.sex||'m'; $('#age').value=st.age; $('#h').value=st.h; $('#w').value=st.w; run(); }

})();
</script>
</body>
</html>
