<body data-section="health">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">운동 칼로리 계산기</h1>
    <p class="page-lead">운동 종류를 고르고 체중과 시간을 넣으면 소모 칼로리를 계산합니다. 밥 공기, 피자 조각, 방울토마토 양으로도 바꿔 보여 줍니다.</p>

    <div class="card">
      <div class="field">
        <label for="act">운동 종류 </label>
        <div class="inbox"><select id="act"></select></div>
      </div>
      <div class="field" id="speedRow" hidden>
        <label for="speed">걷기 속도 </label>
        <div class="inbox"><select id="speed"><option value="3.0">천천히 (시속 4km)</option><option value="3.5" selected>보통 (시속 5km)</option><option value="4.3">빠르게 (시속 6km)</option><option value="5.0">매우 빠르게 (시속 6.5km)</option></select></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="w">몸무게 </label>
          <div class="inbox"><input id="w" inputmode="numeric" placeholder="몸무게"><span class="unit">kg</span></div>
        </div>
        <div class="field">
          <label for="min">운동 시간 </label>
          <div class="inbox"><input id="min" inputmode="numeric" placeholder="운동 시간"><span class="unit">분</span></div>
        </div>
      </div>
      <button class="btn" id="go">소모 칼로리 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">소모 칼로리</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="card">
        <h2>시간별 소모량</h2>
        <table class="t"><tbody id="rows"></tbody></table>
        <p class="sub" style="margin-top:12px;">운동 강도 기준 참고값(MET)으로 계산합니다. 체력과 운동 강도에 따라 실제 소모량은 달라요.</p>
      </div>
      <div class="card">
        <h2>이어서 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};

// 운동 강도 참고값(MET)
var GROUPS=[
  {g:'걷기·달리기', items:[
    {k:'walk', n:'걷기', met:3.5, speed:true},
    {k:'run', n:'달리기 (런닝머신, 시속 8km)', met:8.3},
    {k:'stair', n:'계단 오르기', met:4.0},
    {k:'hike', n:'등산', met:6.0},
    {k:'bike', n:'자전거 (사이클)', met:6.8},
    {k:'rope', n:'줄넘기', met:10.0},
    {k:'hoop', n:'훌라후프', met:4.0}
  ]},
  {g:'수영·요가·유연', items:[
    {k:'swim', n:'수영 (자유형)', met:6.0},
    {k:'yoga', n:'요가', met:2.5},
    {k:'pilates', n:'필라테스 (매트)', met:3.0},
    {k:'aerobic', n:'에어로빅 (저강도)', met:5.0}
  ]},
  {g:'맨몸 근력', items:[
    {k:'situp', n:'윗몸일으키기', met:3.8},
    {k:'bodyw', n:'맨몸 운동 (스쿼트·푸시업 등)', met:3.8},
    {k:'weight', n:'웨이트 트레이닝', met:3.5}
  ]},
  {g:'구기·격투', items:[
    {k:'box', n:'복싱 (샌드백)', met:5.5},
    {k:'squash', n:'스쿼시', met:7.3},
    {k:'tennis', n:'테니스', met:7.3},
    {k:'badminton', n:'배드민턴', met:5.5},
    {k:'tabletennis', n:'탁구', met:4.0},
    {k:'basket', n:'농구', met:6.5},
    {k:'soccer', n:'축구', met:7.0}
  ]}
];
var ALL=[];
GROUPS.forEach(function(gr){ gr.items.forEach(function(it){ ALL.push(it); }); });
var cur=ALL[0];
var KCAL_RICE=300, KCAL_PIZZA=290, G_PER_KCAL=5.5;

function buildSelect(){
  var h='';
  GROUPS.forEach(function(gr){
    h+='<optgroup label="'+gr.g+'">';
    gr.items.forEach(function(it){
      h+='<option value="'+it.k+'"'+(it.k===cur.k?' selected':'')+'>'+it.n+'</option>';
    });
    h+='</optgroup>';
  });
  $('#act').innerHTML=h;
}
function syncSpeed(){ $('#speedRow').hidden = cur.k!=='walk'; }

function run(){
  if(!U.need($('#w'),'몸무게')) return;
  if(!U.need($('#min'),'운동 시간')) return;
  var w=U.num($('#w')), min=U.num($('#min'));
  var met = cur.speed ? (Number($('#speed').value)||3.5) : cur.met;
  if(!w||!min){ $('#out').hidden=true; return; }

  var kcal = met*w*(min/60);
  $('#out').hidden=false;
  $('#big').textContent = Math.round(kcal).toLocaleString()+' kcal';
  $('#note').textContent = min+'분 동안 '+cur.n+'을 했을 때의 소모 칼로리입니다.';
  $('#kpi').innerHTML =
    '<div><b>'+(kcal/KCAL_RICE).toFixed(1)+'공기</b><span>밥</span></div>'+
    '<div><b>'+(kcal/KCAL_PIZZA).toFixed(1)+'조각</b><span>피자</span></div>'+
    '<div><b>'+Math.round(kcal*G_PER_KCAL)+'g</b><span>방울토마토</span></div>';

  var html='<tr><th>운동 시간</th><th>소모 칼로리</th></tr>';
  [10,20,30,60].forEach(function(m){
    html+='<tr><td>'+m+'분</td><td>'+Math.round(met*w*(m/60)).toLocaleString()+' kcal</td></tr>';
  });
  $('#rows').innerHTML=html;

  $('#nextTools').innerHTML=
    '<a href="calorie.html?w='+w+'"><b>칼로리 계산기</b><span>먹는 쪽도 함께 계산해 보세요</span></a>'+
    '<a href="bmi.html?w='+w+'"><b>BMI 계산기</b><span>지금 체중이 어느 단계인지</span></a>';

  U.saveState({w:w,min:min,speed:met,act:cur.k});
}

$('#act').onchange=function(){
  var k=$('#act').value;
  cur=ALL.filter(function(a){return a.k===k;})[0]||cur;
  syncSpeed();
  run();
};
$('#speed').onchange=run;
$('#go').onclick=run;
U.comma($('#w')); U.comma($('#min'));

var st=U.loadState();
if(st.act){ cur=ALL.filter(function(a){return a.k===st.act;})[0]||cur; }
buildSelect();
syncSpeed();
if(st.w){
  $('#w').value=Number(st.w).toLocaleString();
  $('#min').value=st.min;
  if(st.speed && cur.speed) $('#speed').value=String(st.speed);
  run();
}

})();
</script>
</body>
</html>
