<body data-section="money">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">부가세 계산기</h1>
    <p class="page-lead">금액을 원 단위로 그대로 넣으면 됩니다. 세금계산서에 적을 세 줄이 바로 나옵니다.</p>

    <div class="card">
      <h2>무엇을 넣으시나요</h2>
      <div class="modecards" id="modePick" style="grid-template-columns:repeat(2,1fr)"></div>
      <div class="field" style="margin-top:14px">
        <label for="amt" id="amtLab">금액 </label>
        <div class="inbox"><input id="amt" inputmode="numeric" placeholder="원 단위로"><span class="unit">원</span></div>

        <table class="t"><tbody id="rows"></tbody></table>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function won(v){ return Math.floor(v).toLocaleString()+'원'; }
function num(el){ var v=parseFloat(String(el.value).replace(/[^0-9]/g,'')); return isNaN(v)?0:v; }

var MODE=[
  {k:'add', t:'부가세 별도', d:'공급가액을 넣습니다', lab:'공급가액', tip:'세금이 빠진 금액입니다. 여기에 10%를 더해 드립니다.'},
  {k:'sub', t:'부가세 포함', d:'합계금액을 넣습니다', lab:'합계금액', tip:'세금이 이미 들어 있는 금액입니다. 1.1로 나누어 갈라 드립니다.'}
];
var mode='add';
(function(){
  var box=$('#modePick'); box.innerHTML='';
  MODE.forEach(function(m){
    var b=document.createElement('button');
    b.type='button'; b.className='modecard'+(m.k===mode?' on':'');
    b.innerHTML='<div class="mt">'+m.t+'</div><div class="mdz">'+m.d+'</div>';
    b.onclick=function(){
      mode=m.k;
      [].forEach.call(box.children,function(c){ c.classList.remove('on'); });
      b.classList.add('on'); sync(); if(num($('#amt'))>0) run();
    };
    box.appendChild(b);
  });
})();
function sync(){
  var m=MODE.filter(function(x){return x.k===mode;})[0];
  $('#amtLab').textContent=m.lab+' ';
  $('#modeTip').textContent=m.tip;
}
sync();

$('#amt').addEventListener('input',function(){
  var v=num($('#amt'));
  $('#amt').value = v>0 ? v.toLocaleString() : '';
});

function run(){
  var v=num($('#amt'));
  if(!(v>0)){ U.toast('금액을 넣어 주세요'); $('#out').hidden=true; return; }
  var supply, vat, total;
  if(mode==='add'){ supply=v; vat=Math.floor(v*0.1); total=supply+vat; }
  else { total=v; vat=Math.round(v/11); supply=total-vat; }   /* 합계 × 10/110 */

  $('#out').hidden=false;
  $('#lab').textContent='부가세';
  $('#big').textContent=won(vat);
  $('#note').textContent = mode==='add'
    ? '공급가액 '+won(supply)+'에 부가세를 더하면 '+won(total)+'을 받으시면 됩니다.'
    : '합계 '+won(total)+' 안에 부가세 '+won(vat)+'이 들어 있습니다.';
  $('#kpi').innerHTML=
    '<div><b>'+won(supply)+'</b><span>공급가액</span></div>'+
    '<div><b>'+won(vat)+'</b><span>부가세</span></div>'+
    '<div><b>'+won(total)+'</b><span>합계금액</span></div>';
  $('#rows').innerHTML=
    '<tr><th>항목</th><th>금액</th></tr>'+
    row('공급가액','<b>'+won(supply)+'</b>')+
    row('부가세 <div class="c">공급가액의 10%</div>','<b>'+won(vat)+'</b>')+
    '<tr class="sum"><td>합계금액</td><td>'+won(total)+'</td></tr>';
  $('#nextTools').innerHTML=
    '<a href="salary.html"><b>연봉계산기</b><span>세금 떼고 월 얼마</span></a>'+
    '<a href="loan.html"><b>대출이자계산기</b><span>상환방식별 월 상환액</span></a>';
}
$('#go').onclick=run;

})();
</script>
</body>
</html>
