<body data-section="money">

<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">적금이자계산기 · 예금 이자</h1>
    <p class="page-lead">이자에는 세금이 붙습니다. 세금을 떼고 만기에 실제로 받는 금액을 계산합니다.</p>

    <div class="card">
      <h2>가입 조건</h2>
      <div class="field">
        <label for="kind">종류 </label>
        <div class="inbox"><select id="kind"><option value="deposit">예금 (목돈을 한 번에 맡김)</option><option value="saving">적금 (매달 넣음)</option></select></div>
      </div>      <div class="field">
        <label for="amount">금액 <span class="hint">예금은 원금, 적금은 매달 넣는 돈</span></label>
        <div class="inbox"><input id="amount" inputmode="numeric" placeholder="예금 1000 / 적금 50"><span class="unit">만원</span></div>
      </div>      <div class="row2">      <div class="field">
        <label for="rate">연 이율 </label>
        <div class="inbox"><input id="rate" type="text" placeholder="이율" value="3.5"><span class="unit">%</span></div>
      </div>      <div class="field">
        <label for="months">기간 </label>
        <div class="inbox"><input id="months" type="text" placeholder="개월" value="12"><span class="unit">개월</span></div>
      </div></div>      <div class="field">
        <label for="tax">세금 <span class="hint">가입 조건에 따라 다릅니다</span></label>
        <div class="inbox"><select id="tax">
          <option value="15.4">일반과세 15.4%</option>
          <option value="1.4">상호금융 1.4% (조합원)</option>
          <option value="5">상호금융 5% (고소득)</option>
          <option value="0">비과세 0%</option>
        </select></div>
      </div>
      <button class="btn" id="go">이자 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>

      <div class="card">
        <h2>계산 결과</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>

      <div class="card">
        <h2>이어서 계산해 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>

  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

U.comma($('#amount'));
function run(){
  if(!U.need($('#amount'),'금액')) return;
  if(!U.manOk($('#amount'),'금액')) return;
  if(!U.need($('#rate'),'연 이율')) return;
  var kind=$('#kind').value, A=U.man($('#amount'));
  var rate=Number($('#rate').value)||0, n=Number($('#months').value)||12;
  var taxRate=Number($('#tax').value)/100;
  if(A<=0){ $('#out').hidden=true; return; }
  var principal, interest;
  if(kind==='deposit'){
    principal=A; interest=A*(rate/100)*(n/12);
  } else {
    principal=A*n;
    interest=A*(rate/100/12)*(n*(n+1)/2);
  }
  var tax=interest*taxRate, net=interest-tax, total=principal+net;

  $('#out').hidden=false;
  $('#lab').textContent='만기에 받는 돈';
  $('#big').textContent=U.won(total);
  $('#note').textContent=(kind==='deposit'?'예금 ':'적금 ')+U.won(A)+(kind==='saving'?'씩 ':' ')+n+'개월 · 연 '+rate+'% 기준입니다.';
  $('#kpi').innerHTML=
    '<div><b>'+U.won(principal)+'</b><span>원금</span></div>'+
    '<div><b>'+U.won(interest)+'</b><span>세전 이자</span></div>'+
    '<div><b>'+U.won(net)+'</b><span>세후 이자</span></div>'+
    '<div><b>'+(principal? (Math.round(net/principal*1000)/10):0)+'%</b><span>실질 수익률</span></div>';
  $('#tsub').textContent = kind==='saving'
    ? '적금은 먼저 넣은 돈일수록 이자가 오래 붙습니다. 그래서 표시 금리보다 실제 수익률이 낮습니다.'
    : '예금은 원금 전체에 기간만큼 이자가 붙습니다.';
  $('#rows').innerHTML=
    row('원금', U.won(principal), kind==='saving'? U.won(A)+' × '+n+'개월':'')+
    row('세전 이자', U.won(interest),'')+
    row('이자소득세', '-'+U.won(tax), (taxRate*100)+'%')+
    row('세후 이자', U.won(net),'')+
    sumrow('만기 수령액', U.won(total));
  $('#nextTools').innerHTML=
    '<a href="loan.html"><b>대출이자계산기</b><span>빌릴 때 내는 이자는 얼마인지</span></a>'+
    '<a href="salary.html"><b>연봉계산기</b><span>매달 얼마를 모을 수 있는지</span></a>';
  U.saveState({kind:kind,amount:A,rate:rate,months:n,tax:$('#tax').value});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.amount){ $('#amount').value=(Number(st.amount)/10000).toLocaleString();
  if(st.kind)$('#kind').value=st.kind; if(st.rate)$('#rate').value=st.rate;
  if(st.months)$('#months').value=st.months; if(st.tax)$('#tax').value=st.tax; run(); }

})();
</script>
</body>
</html>
