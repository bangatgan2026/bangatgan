name: lotto-update

on:
  schedule:
    - cron: '40 12 * * 6'   # 토 21:40
    - cron: '40 14 * * 6'   # 토 23:40
    - cron: '40 17 * * 6'   # 일 02:40
    - cron: '10 1 * * 0'    # 일 10:10
    - cron: '10 5 * * 0'    # 일 14:10
    - cron: '10 11 * * 0'   # 일 20:10
    - cron: '10 15 * * 0'   # 월 00:10
    - cron: '10 3 * * 1'    # 월 12:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: fetch
        run: node scripts/update-lotto.js
      - name: commit
        run: |
          git config user.name "lotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/draws.json assets/lotto-data.js
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "lotto update"
            git push
          fi
