<body data-section="lotto">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">로또 당첨금 계산기 — 세금</h1>
    <p class="page-lead">당첨금에서 세금을 떼고 통장에 실제로 들어오는 금액을 계산합니다.</p>

    <div class="card">
      <h2>당첨금 입력</h2>
      <div class="field">
        <label for="prize">당첨금 <span class="hint">세금 떼기 전, 당첨증에 적힌 금액 그대로</span></label>
        <div class="inbox"><input id="prize" inputmode="numeric" placeholder="예: 1791817758"><span class="unit">원</span></div>
        <div class="slidebox">
          <input type="range" id="prizeRange" min="0" max="1000" value="640" aria-label="당첨금 조절">
          <div class="sticks"><span>5만원</span><span>500만</span><span>5천만</span><span>5억</span><span>50억</span></div>
        </div>
      </div>
      <button class="btn" id="go">실수령액 계산</button>
      <div class="tipbox" style="margin-top:14px"><b style="color:var(--gold)">4등 5만원과 5등 5천원은 세금이 없습니다.</b><br>200만원 이하는 그대로 받습니다. 1등부터 3등까지는 회차마다 당첨금이 다르니 실제 받으신 금액을 넣어 확인하세요.</div>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab">실제로 받는 금액</div>
        <div class="big" id="big"></div>
        <div class="gauge"><div class="gnet" id="gNet"><i></i></div></div>
        <div class="glabel"><span class="ln">실수령 <b id="gNetP">0%</b></span><span class="lt"><b id="gTaxP">0%</b> 세금</span></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="card">
        <h2>세금 내역</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>

        <h2>이어서 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>

    <div class="ad wide"><span>광고 자리</span></div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }
U.comma($('#prize'));
/* 이 화면만 원 단위로 받습니다. 당첨증 금액을 그대로 넣게 하기 위해서입니다. */
function won(el){ return Number(String(el.value).replace(/[^0-9]/g,'')) || 0; }

function run(quiet){
  if(quiet){ if(!(won($('#prize'))>0)) return; }
  else {
    if(!U.need($('#prize'),'당첨금')) return;
  }
  var p=won($('#prize'));
  var tax1=0, tax2=0;
  if(p>2000000){
    tax1 = Math.min(p,300000000)*0.22;
    if(p>300000000) tax2 = (p-300000000)*0.33;
  }
  var tax=tax1+tax2, net=p-tax;

  $('#out').hidden=false;
  $('#big').textContent=U.won(net);
  $('#note').textContent = p<=2000000
    ? '200만원 이하는 세금이 붙지 않습니다. 당첨금 전액을 받습니다.'
    : '당첨금 '+U.won(p)+'에서 세금 '+U.won(tax)+'을 뗀 금액입니다. '+
      '전체의 '+(Math.round(tax/p*1000)/10)+'%가 세금으로 나갑니다.';
  $('#kpi').innerHTML=
    '<div><b>'+U.won(p)+'</b><span>당첨금</span></div>'+
    '<div><b>'+U.won(tax)+'</b><span>세금</span></div>'+
    '<div><b>'+(Math.round((p?tax/p:0)*1000)/10)+'%</b><span>실효 세율</span></div>'+
    '<div><b>'+U.won(net)+'</b><span>실수령액</span></div>';
  var netP = p>0 ? net/p*100 : 100;
  $('#gNet').style.width=netP.toFixed(1)+'%';
  $('#gNetP').textContent=Math.round(netP*10)/10+'%';
  $('#gTaxP').textContent=Math.round((100-netP)*10)/10+'%';
  $('#tsub').textContent='3억까지는 22%, 3억을 넘는 부분에만 33%가 적용됩니다.';
  var html='';
  if(p<=2000000){
    html = row('당첨금', U.won(p),'')+row('세금','없음','200만원 이하는 비과세')+sumrow('실수령액', U.won(net));
  } else {
    html = row('당첨금', U.won(p),'');
    html += row('3억 이하분 세금', U.won(tax1), U.won(Math.min(p,300000000))+' × 22%');
    if(tax2>0) html += row('3억 초과분 세금', U.won(tax2), U.won(p-300000000)+' × 33%');
    html += row('세금 합계', U.won(tax),'소득세 + 지방소득세');
    html += sumrow('실수령액', U.won(net));
  }
  $('#rows').innerHTML=html;
  $('#nextTools').innerHTML=
    '<a href="savings.html?amount='+Math.round(net)+'"><b>적금이자계산기</b><span>이자가 얼마나 붙는지</span></a>'+
    '<a href="guide-claim.html"><b>당첨금 받는 방법</b><span>어디서 어떻게 받는지</span></a>';
  U.saveState({prize:p});
}
/* 슬라이더 — 금액 폭이 넓어 로그 눈금을 씁니다 */
var RMIN=50000, RMAX=5000000000;
var lgMin=Math.log(RMIN), lgMax=Math.log(RMAX);
function t2amt(t){
  var v=Math.exp(lgMin+(t/1000)*(lgMax-lgMin));
  var unit = v<1000000?10000 : v<100000000?100000 : 1000000;
  return Math.max(RMIN, Math.round(v/unit)*unit);
}
function amt2t(a){
  a=Math.min(RMAX,Math.max(RMIN,a));
  return Math.round((Math.log(a)-lgMin)/(lgMax-lgMin)*1000);
}
var rng=$('#prizeRange');
rng.oninput=function(){
  var a=t2amt(+rng.value);
  $('#prize').value=a.toLocaleString();
  run(true);
};
$('#prize').addEventListener('input', function(){
  var a=won($('#prize'));
  if(a>0){ rng.value=amt2t(a); run(true); }
});
$('#go').onclick=function(){ run(); };
var st=U.loadState();
if(st.prize){ $('#prize').value=Number(st.prize).toLocaleString(); rng.value=amt2t(Number(st.prize)); run(true); }
else { rng.dispatchEvent(new Event('input')); }
})();
</script>
</body>
