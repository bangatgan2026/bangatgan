<body data-section="health">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">걷기 칼로리 계산기</h1>
    <p class="page-lead">얼마나 걸으면 얼마가 소모되는지 계산합니다.</p>
    <div class="card">
      <h2>걷기 조건</h2>
      <div class="field">
        <label for="w">몸무게 </label>
        <div class="inbox"><input id="w" inputmode="numeric" placeholder="몸무게"><span class="unit">kg</span></div>
      </div>      <div class="row2">      <div class="field">
        <label for="min">걷는 시간 </label>
        <div class="inbox"><input id="min" inputmode="numeric" placeholder="걷는 시간"><span class="unit">분</span></div>
      </div>      <div class="field">
        <label for="speed">속도 </label>
        <div class="inbox"><select id="speed"><option value="3.0">천천히 (시속 4km)</option><option value="3.5">보통 (시속 5km)</option><option value="4.3">빠르게 (시속 6km)</option><option value="5.0">매우 빠르게 (시속 6.5km)</option></select></div>
      </div></div>
      <button class="btn" id="go">소모 칼로리 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="card">
        <h2>시간별 소모량</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>
      <div class="card">
        <h2>이어서 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>
  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=91"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

U.comma($('#w')); U.comma($('#min'));
function dist(km){ return km<1 ? Math.round(km*1000)+'m' : (Math.round(km*10)/10)+'km'; }
function run(){
  if(!U.need($('#w'),'몸무게')) return;
  if(!U.need($('#min'),'걷는 시간')) return;
  var w=U.num($('#w')), min=U.num($('#min')), met=Number($('#speed').value)||3.5;
  if(!w||!min){ $('#out').hidden=true; return; }
  var kcal=met*w*(min/60);
  var kmh = met===3.0?4 : met===3.5?5 : met===4.3?6 : 6.5;
  var km = kmh*(min/60);
  var steps = Math.round(km*1000/0.7);

  $('#out').hidden=false;
  $('#lab').textContent='소모 칼로리';
  $('#big').textContent=Math.round(kcal).toLocaleString()+' kcal';
  $('#note').textContent=min+'분 동안 시속 '+kmh+'km로 걸었을 때입니다. 약 '+dist(km)+', '+steps.toLocaleString()+'걸음에 해당합니다.';
  $('#kpi').innerHTML=
    '<div><b>'+Math.round(kcal).toLocaleString()+'</b><span>소모 칼로리</span></div>'+
    '<div><b>'+dist(km)+'</b><span>거리</span></div>'+
    '<div><b>'+steps.toLocaleString()+'</b><span>걸음 수</span></div>'+
    '<div><b>'+(kcal/7700*1000).toFixed(0)+'g</b><span>체지방 환산</span></div>';
  $('#tsub').textContent='같은 속도로 시간만 늘렸을 때의 소모량입니다.';
  var html='<tr><th>걷는 시간</th><th>소모 칼로리</th><th>거리</th></tr>';
  [10,20,30,60,90].forEach(function(m){
    html+='<tr><td>'+m+'분</td><td>'+Math.round(met*w*(m/60)).toLocaleString()+' kcal</td><td>'+(kmh*(m/60)).toFixed(1)+'km</td></tr>';
  });
  $('#rows').innerHTML=html;
  $('#nextTools').innerHTML=
    '<a href="calorie.html?w='+w+'"><b>칼로리 계산기</b><span>먹는 쪽도 함께 계산해 보세요</span></a>'+
    '<a href="bmi.html?w='+w+'"><b>BMI 계산기</b><span>지금 체중이 어느 단계인지</span></a>';
  U.saveState({w:w,min:min,speed:met});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.w){ $('#w').value=Number(st.w).toLocaleString(); $('#min').value=st.min; if(st.speed)$('#speed').value=st.speed; run(); }

})();
</script>
</body>
</html>
