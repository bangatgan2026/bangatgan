<body data-section="date">

<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">만나이계산기</h1>
    <p class="page-lead">생년월일만 넣으면 오늘 기준으로 만 나이, 연 나이, 세는 나이를 함께 보여줍니다.</p>

    <div class="card">
      <h2>날짜 입력</h2>
      <div class="field">
        <label for="birth">생년월일</label>
        <div class="inbox"><input id="birth" type="date" data-max="today" placeholder="" value=""></div>
      </div>
      <button class="btn" id="go">나이 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>

      <div class="card">
        <h2>나이 세는 방법별 비교</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>

      <div class="card">
        <h2>이어서 계산해 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>

  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

function run(){
  if(!U.needDate($('#birth'),'생년월일')) return;
  var b=$('#birth').value;
  if(!b){ $('#out').hidden=true; return; }
  var bd=new Date(b), now=new Date();
  now.setHours(0,0,0,0);
  if(bd>now){ alert('생년월일이 오늘보다 뒤일 수는 없습니다.'); return; }
  var age=now.getFullYear()-bd.getFullYear();
  if(now.getMonth()<bd.getMonth()||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate())) age--;
  var yearAge=now.getFullYear()-bd.getFullYear();
  var korAge=yearAge+1;
  var days=Math.round((now-bd)/86400000);
  var WD=['일','월','화','수','목','금','토'];

  $('#out').hidden=false;
  $('#lab').textContent='만 나이';
  $('#big').textContent=age+'세';
  $('#note').textContent='오늘 기준 · 태어난 지 '+days.toLocaleString()+'일이 지났습니다.';
  $('#kpi').innerHTML=
    '<div><b>'+age+'세</b><span>만 나이</span></div>'+
    '<div><b>'+yearAge+'세</b><span>연 나이</span></div>'+
    '<div><b>'+korAge+'세</b><span>세는 나이</span></div>'+
    '<div><b>'+WD[bd.getDay()]+'요일</b><span>태어난 요일</span></div>';
  $('#tsub').textContent='같은 사람도 세는 방법에 따라 나이가 다릅니다.';
  $('#rows').innerHTML=
    row('만 나이', age+'세','법령과 계약의 기본')+
    row('연 나이', yearAge+'세','술·담배, 병역 판정')+
    row('세는 나이', korAge+'세','일상 대화에서 쓰던 방식')+
    row('성년 여부', age>=19?'성년':'미성년','만 19세 기준')+
    row('살아온 날', days.toLocaleString()+'일','');
  $('#nextTools').innerHTML=
    '<a href="birthday.html?y='+bd.getFullYear()+'&m='+(bd.getMonth()+1)+'&d='+bd.getDate()+'"><b>생년월일 계산기</b><span>띠, 별자리, 학교 연도까지 한 번에</span></a>'+
    '<a href="dday.html"><b>디데이계산기</b><span>중요한 날까지 며칠 남았는지</span></a>';
  U.saveState({birth:b});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.birth){ $('#birth').value=st.birth; run(); }

})();
</script>
</body>
