<body data-section="money">

<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">대출이자계산기</h1>
    <p class="page-lead">같은 돈을 빌려도 갚는 방식에 따라 매달 나가는 돈과 총 이자가 달라집니다. 세 가지 방식을 나란히 비교해 보세요.</p>

    <div class="card">
      <h2>대출 조건</h2>
      <div class="field">
        <label for="amount">대출 금액 </label>
        <div class="inbox"><input id="amount" inputmode="numeric" placeholder="예: 30000 (3억)"><span class="unit">만원</span></div>
      </div>      <div class="row2">      <div class="field">
        <label for="rate">연 금리</label>
        <div class="inbox"><input id="rate" type="text" placeholder="예: 4.2"><span class="unit">%</span></div>
      </div>      <div class="field">
        <label for="months">대출 기간 <span class="hint">개월 수</span></label>
        <div class="inbox"><input id="months" type="text" placeholder="예: 360 (30년)"><span class="unit">개월</span></div>
      </div></div>
      <div class="field">
        <label for="grace">거치 기간 <span class="hint">이자만 내는 기간, 없으면 0</span></label>
        <div class="inbox"><input id="grace" type="text" placeholder="예: 12"><span class="unit">개월</span></div>
      </div>
      <button class="btn" id="go">상환액 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>

      <div class="card">
        <h2>상환 방식 비교</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>

      <div class="card">
        <h2>이어서 계산해 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>

  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>

<script src="assets/site.js?v=92"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

U.comma($('#amount'));
function run(){
  if(!U.need($('#amount'),'대출 금액')) return;
  if(!U.manOk($('#amount'),'대출 금액')) return;
  if(!U.need($('#rate'),'연 금리')) return;
  if(!U.need($('#months'),'대출 기간')) return;
  var P=U.man($('#amount')), rate=Number($('#rate').value)||0;
  var n=Math.round(Number($('#months').value)||0);
  var g=Math.round(Number($('#grace').value)||0);
  if(g>=n){ U.toast('거치 기간은 대출 기간보다 짧아야 합니다'); return; }
  var r=rate/100/12, pay=n-g;

  /* 원리금균등 (거치 후 남은 기간 동안 상환) */
  var payA = r===0 ? P/pay : P*r*Math.pow(1+r,pay)/(Math.pow(1+r,pay)-1);
  var graceInt = P*r*g;
  var totalA = payA*pay + graceInt, intA = totalA-P;

  /* 원금균등 */
  var firstB = P/pay + P*r, lastB = P/pay + (P/pay)*r;
  var intB = graceInt; for(var i=0;i<pay;i++) intB += (P - P/pay*i)*r;
  var totalB = P + intB;

  /* 만기일시 */
  var payC = P*r, intC = payC*n, totalC = P + intC;

  $('#out').hidden=false;
  $('#lab').textContent = g>0 ? '거치 후 매달 갚는 돈 (원리금균등)' : '원리금균등 · 매달 갚는 돈';
  $('#big').textContent=U.won(payA);
  var yrs = Math.round(n/12*10)/10;
  $('#note').textContent = U.won(P)+'을 연 '+rate+'%로 '+n+'개월('+yrs+'년) 빌릴 때입니다.'
    + (g>0 ? ' 처음 '+g+'개월은 이자만 '+U.won(P*r)+'씩 내고, 이후 '+pay+'개월 동안 원금과 이자를 함께 갚습니다.' : '')
    + ' 이자로만 '+U.won(intA)+'이 나갑니다.';
  $('#kpi').innerHTML=
    '<div><b>'+U.won(totalA)+'</b><span>총 상환액</span></div>'+
    '<div><b>'+U.won(intA)+'</b><span>이자 총액</span></div>'+
    '<div><b>'+Math.round(intA/P*100)+'%</b><span>원금 대비 이자</span></div>'+
    '<div><b>'+n+'회</b><span>상환 횟수</span></div>';
  $('#tsub').textContent='같은 조건에서 갚는 방식만 바꾼 결과입니다.'
    + (g>0 ? ' 거치 기간 '+g+'개월이 반영되어 있습니다.' : '');
  $('#rows').innerHTML=
    '<tr><th>방식</th><th>매달</th><th>이자 총액</th></tr>'+
    '<tr><td>원리금균등<div class="c">'+(g>0?'거치 후 ':'')+'매달 같은 금액</div></td><td>'+U.won(payA)+'</td><td>'+U.won(intA)+'</td></tr>'+
    '<tr><td>원금균등<div class="c">첫 달 '+U.won(firstB)+' → 마지막 달 '+U.won(lastB)+'</div></td><td>점점 감소</td><td>'+U.won(intB)+'</td></tr>'+
    '<tr><td>만기일시<div class="c">만기에 원금 '+U.won(P)+' 한 번에</div></td><td>'+U.won(payC)+'</td><td>'+U.won(intC)+'</td></tr>'+
    (g>0 ? '<tr class="sum"><td>거치 기간에 낸 이자</td><td>'+g+'개월</td><td>'+U.won(graceInt)+'</td></tr>' : '');
  $('#nextTools').innerHTML=
    '<a href="prepay.html?amount='+P+'"><b>중도상환수수료 계산기</b><span>미리 갚으면 얼마를 더 내야 하는지</span></a>'+
    '<a href="salary.html"><b>연봉계산기</b><span>월급에서 이만큼 낼 수 있는지</span></a>';
  U.saveState({amount:P,rate:rate,months:n,grace:g});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.amount){ $('#amount').value=(Number(st.amount)/10000).toLocaleString();
  if(st.rate)$('#rate').value=st.rate;
  if(st.months)$('#months').value=st.months;
  if(st.grace)$('#grace').value=st.grace; run(); }

})();
</script>
