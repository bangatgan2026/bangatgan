<body data-section="lotto">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">로또번호 통계</h1>
    <p class="page-lead">지금까지 나온 번호를 정리했습니다. 다음 회차와는 관련이 없는 지난 기록입니다.</p>
    <div class="card">
      <h2>집계 기간</h2>
      <div class="seg" id="segRange"></div>
    </div>

    <div class="card">
      <h2>번호별 나온 횟수</h2>
      <p class="sub" id="statSub"></p>
      <div class="barmap" id="heatmap"></div>
      <div class="hlegend">
        <span>적게 나옴</span>
        <i></i>
        <span>자주 나옴</span>
      </div>
      <div class="tipbox">숫자 아래 작은 수는 그 번호가 나온 횟수입니다. 색이 밝다고 다음에 더 잘 나오는 것은 아닙니다.</div>

    </div>

    <div class="card">
      <h2>많이 나온 번호</h2>
      <div class="balls" id="hotChips"></div>
    </div>

    <div class="card">
      <h2>오래 안 나온 번호</h2>
      <p class="sub">숫자는 마지막으로 나온 뒤 지난 회차 수입니다.</p>
      <div id="coldList"></div>
    </div>

    <div class="card">
      <h2>번호 합계 분포</h2>
      <table class="t"><tbody id="sumDist"></tbody></table>
    </div>

    <div class="card">
      <h2>홀짝 구성</h2>
      <table class="t"><tbody id="oeDist"></tbody></table>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>
  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>
<script src="assets/lotto-data.js?v=98"></script>
<script src="assets/site.js?v=98"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

var D=LOTTO.draws, range=100;
function scope(){ return range==='all'? D : D.slice(-range); }
function render(){
  var ds=scope(), i;
  var cnt=new Array(46).fill(0), last=new Array(46).fill(-1);
  ds.forEach(function(d,idx){ d.n.forEach(function(x){ cnt[x]++; last[x]=idx; }); });
  $('#statSub').textContent=ds[0].no+'회부터 '+ds[ds.length-1].no+'회까지 '+ds.length+'회 기준입니다. 금색이 밝을수록 자주 나온 번호입니다.';
  var mn=Math.min.apply(null,cnt.slice(1)), mx=Math.max.apply(null,cnt.slice(1));
  var H=$('#heatmap'); H.innerHTML='';
  var span = (mx-mn)||1;
  for(i=1;i<=45;i++){
    /* 가장 적게 나온 번호를 0, 가장 많이 나온 번호를 1로 두고 색 농도를 정합니다 */
    var t = (cnt[i]-mn)/span;
    var cell=document.createElement('div'); cell.className='hcell';
    cell.style.background='rgba(227,183,91,'+(0.06+t*0.86).toFixed(3)+')';
    cell.style.borderColor='rgba(227,183,91,'+(0.14+t*0.5).toFixed(3)+')';
    if(t>0.55){ cell.classList.add('dark'); }
    cell.innerHTML='<b>'+i+'</b><span>'+cnt[i]+'</span>';
    cell.title=i+'번 '+cnt[i]+'회';
    H.appendChild(cell);
  }
  var order=[]; for(i=1;i<=45;i++) order.push([i,cnt[i]]);
  var hot=order.slice().sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var HC=$('#hotChips'); HC.innerHTML='';
  hot.forEach(function(p){
    var wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:5px';
    wrap.appendChild(LOTTO.ball(p[0],'lg'));
    var s=document.createElement('span');
    s.style.cssText='font-size:11px;color:var(--dim);font-weight:600';
    s.textContent=p[1]+'회'; wrap.appendChild(s);
    HC.appendChild(wrap);
  });
  var cold=[]; for(i=1;i<=45;i++) cold.push([i, last[i]<0?ds.length:ds.length-1-last[i]]);
  cold.sort(function(a,b){return b[1]-a[1];});
  var CL=$('#coldList'); CL.innerHTML='';
  cold.slice(0,6).forEach(function(p){
    var div=document.createElement('div'); div.className='lrow';
    div.appendChild(LOTTO.ball(p[0],'lg'));
    var s=document.createElement('span');
    s.style.cssText='margin-left:auto;font-size:13px;color:var(--ink2);font-weight:650';
    s.textContent=p[1]+'회 동안 안 나옴'; div.appendChild(s);
    CL.appendChild(div);
  });
  var buckets=[[0,90],[91,120],[121,150],[151,180],[181,210],[211,255]], bc=new Array(6).fill(0);
  ds.forEach(function(d){
    var s=d.n.reduce(function(a,b){return a+b;},0);
    for(i=0;i<6;i++) if(s>=buckets[i][0]&&s<=buckets[i][1]){ bc[i]++; break; }
  });
  var html='<tr><th>번호 합</th><th>회차 수</th><th>비율</th></tr>';
  buckets.forEach(function(b,idx){
    var label = b[0]===0?'90 이하':(b[1]===255?'211 이상':b[0]+'~'+b[1]);
    html+='<tr><td>'+label+'</td><td>'+bc[idx]+'회</td><td>'+(Math.round(bc[idx]/ds.length*1000)/10)+'%</td></tr>';
  });
  $('#sumDist').innerHTML=html;
  var oe=new Array(7).fill(0);
  ds.forEach(function(d){ oe[d.n.filter(function(x){return x%2;}).length]++; });
  var h2='<tr><th>구성</th><th>회차 수</th><th>비율</th></tr>';
  oe.forEach(function(v,idx){
    h2+='<tr><td>홀 '+idx+' · 짝 '+(6-idx)+'</td><td>'+v+'회</td><td>'+(Math.round(v/ds.length*1000)/10)+'%</td></tr>';
  });
  $('#oeDist').innerHTML=h2;
}
var s=$('#segRange');
[[50,'최근 50회'],[100,'최근 100회'],['all','전체 회차']].forEach(function(p){
  var b=document.createElement('button');
  b.className=range===p[0]?'on':''; b.textContent=p[1];
  b.onclick=function(){
    range=p[0];
    [].forEach.call(s.children,function(c,i){ c.classList.toggle('on',[50,100,'all'][i]===range); });
    render();
  };
  s.appendChild(b);
});
render();

})();
</script>
</body>
