<body data-section="estate">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">주택담보대출 계산기 — 한도</h1>
    <p class="page-lead">집값으로 정해지는 한도(LTV)와 소득으로 정해지는 한도(DSR) 중 낮은 쪽이 실제 한도가 됩니다.</p>

    <div class="card">
      <h2>대출 조건</h2>
      <div class="field">
        <label for="price">집값 <span class="hint">매매가 또는 감정가</span></label>
        <div class="inbox"><input id="price" inputmode="numeric" placeholder="예: 60000 (6억)"><span class="unit">만원</span></div>
      </div>      <div class="row2">      <div class="field">
        <label for="ltv">LTV 비율 <span class="hint">지역·조건에 따라 다름</span></label>
        <div class="inbox"><input id="ltv" inputmode="numeric" placeholder="예: 70"><span class="unit">%</span></div>
      </div>      <div class="field">
        <label for="income">연 소득 <span class="hint">세전</span></label>
        <div class="inbox"><input id="income" inputmode="numeric" placeholder="예: 5000 (5천만원)"><span class="unit">만원</span></div>
      </div></div>      <div class="row2">      <div class="field">
        <label for="rate">금리 </label>
        <div class="inbox"><input id="rate" inputmode="numeric" placeholder="예: 4.2"><span class="unit">%</span></div>
      </div>      <div class="field">
        <label for="years">대출 기간 </label>
        <div class="inbox"><input id="years" inputmode="numeric" placeholder="예: 30"><span class="unit">년</span></div>
      </div></div>      <div class="field">
        <label for="other">기존 대출 연간 상환액 <span class="hint">신용대출 등, 없으면 0</span></label>
        <div class="inbox"><input id="other" inputmode="numeric" placeholder="없으면 0"><span class="unit">만원</span></div>
      </div>
      <button class="btn" id="go">한도 계산</button>
    </div>

    <div id="out" hidden>
      <div class="result">
        <div class="lab" id="lab">결과</div>
        <div class="big" id="big"></div>
        <div class="note" id="note"></div>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="card">
        <h2>한도 비교</h2>
        <p class="sub" id="tsub"></p>
        <table class="t"><tbody id="rows"></tbody></table>
      </div>
      <div class="card">
        <h2>이어서 계산해 보기</h2>
        <div class="next" id="nextTools"></div>
      </div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>

<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

['price','income','other'].forEach(function(id){ U.comma($('#'+id)); });
function run(){
  if(!U.need($('#price'),'집값')) return;
  if(!U.manOk($('#price'),'집값')) return;
  if(!U.need($('#ltv'),'LTV 비율')) return;
  if(!U.need($('#income'),'연 소득')) return;
  if(!U.manOk($('#income'),'연 소득')) return;
  if(!U.need($('#rate'),'금리')) return;
  if(!U.need($('#years'),'대출 기간')) return;
  var price=U.man($('#price')), ltv=Number($('#ltv').value)||0;
  var income=U.man($('#income')), rate=Number($('#rate').value)||0;
  var years=Number($('#years').value)||30, other=U.man($('#other'));

  var ltvLimit = price*ltv/100;
  var n=years*12, r=rate/100/12;
  /* 연 소득의 40%에서 기존 대출 상환액을 뺀 금액이 새 대출에 쓸 수 있는 한도 */
  var room = income*0.4 - other;
  var dsrLimit = 0;
  if(room > 0){
    var monthly = room/12;
    dsrLimit = r===0 ? monthly*n : monthly*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n));
  }
  var limit = Math.max(0, Math.min(ltvLimit, dsrLimit));
  var payA = r===0 ? limit/n : limit*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  var need = price - limit;

  $('#out').hidden=false;
  $('#lab').textContent='빌릴 수 있는 금액';
  $('#big').textContent=U.won(limit);
  $('#note').textContent = room<=0
    ? '기존 대출의 연간 상환액이 이미 소득의 40%를 넘어 추가 대출이 어렵습니다.'
    : (ltvLimit<=dsrLimit
        ? '집값으로 정해지는 한도(LTV)가 더 낮아 이 금액이 한도가 됩니다. 매달 '+U.won(payA)+'씩 갚게 됩니다.'
        : '소득으로 정해지는 한도(DSR)가 더 낮아 이 금액이 한도가 됩니다. 소득이 늘거나 기존 대출을 줄이면 한도가 올라갑니다.');
  $('#kpi').innerHTML=
    '<div><b>'+U.won(ltvLimit)+'</b><span>LTV 한도</span></div>'+
    '<div><b>'+U.won(dsrLimit)+'</b><span>DSR 한도</span></div>'+
    '<div><b>'+U.won(payA)+'</b><span>월 상환액</span></div>'+
    '<div><b>'+U.won(need)+'</b><span>필요한 자기 자금</span></div>';
  $('#tsub').textContent='둘 중 낮은 쪽이 실제 한도가 됩니다. 스트레스 DSR이 적용되면 은행 한도는 이보다 적을 수 있습니다.';
  $('#rows').innerHTML=
    row('집값', U.won(price),'')+
    row('LTV 한도', U.won(ltvLimit), '집값의 '+ltv+'%')+
    row('DSR 한도', U.won(dsrLimit), '연 소득의 40% 이내로 갚을 수 있는 금액')+
    row('기존 대출 연간 상환액', U.won(other), other>0? 'DSR 한도에서 차감됩니다':'없음')+
    sumrow('실제 한도', U.won(limit))+
    row('필요한 자기 자금', U.won(need),'취득세와 중개수수료는 별도입니다');
  $('#nextTools').innerHTML=
    '<a href="loan.html?amount='+Math.round(limit)+'&rate='+rate+'&months='+Math.round(years*12)+'"><b>대출이자계산기</b><span>이 금액으로 매달 얼마씩 갚는지</span></a>'+
    '<a href="acquisition.html?price='+price+'"><b>취득세 계산기</b><span>집값 말고 더 드는 돈</span></a>';
  U.saveState({price:price,ltv:ltv,income:income,rate:rate,years:years,other:other});
}
$('#go').onclick=run;
var st=U.loadState();
if(st.price){
  $('#price').value=(Number(st.price)/10000).toLocaleString();
  if(st.ltv)$('#ltv').value=st.ltv;
  if(st.income)$('#income').value=(Number(st.income)/10000).toLocaleString();
  if(st.rate)$('#rate').value=st.rate; if(st.years)$('#years').value=st.years;
  if(st.other)$('#other').value=(Number(st.other)/10000).toLocaleString();
  if(st.income) run();
}

})();
</script>
</body>
