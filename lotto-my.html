<body data-section="lotto">
<div class="wrap">
  <aside class="side"></aside>
  <main>
    <h1 class="page-h">내 로또번호 저장</h1>
    <p class="page-lead">저장한 번호는 이 기기 안에만 보관됩니다. 서버로 전송되지 않습니다.</p>
    <div class="card">
      <h2>저장한 번호</h2>
      <p class="sub" id="mySub"></p>
      <div id="myList"></div>
    </div>

    <div class="card">
      <div class="genrow" id="manTog">
        <h2>번호 직접 넣기</h2>
        <span class="protog"><span class="sw" id="manSw"></span></span>
      </div>
      <div class="acc" id="manAcc"><div class="inner">
        <div class="tipbox" style="margin-top:2px;margin-bottom:14px">편의점에서 산 번호나 직접 고른 번호를 넣어 두면, 추첨된 뒤 자동으로 대조합니다. 여섯 개를 고르고 저장을 누르세요.</div>
        <div class="grid45" id="gridManual"></div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn ghost sm" style="flex:1" id="btnClear">선택 지우기</button>
          <button class="btn sm" style="flex:1" id="btnSave">저장</button>
        </div>
      </div></div>
    </div>

    <div class="card">
      <h2>관리</h2>
      <div class="row"><div class="grow"><div class="t">저장 위치</div>
        <div class="d">번호는 이 기기의 브라우저에만 저장됩니다. 다른 기기에서는 보이지 않습니다.</div></div></div>
      <div class="row"><div class="grow"><div class="t">모두 지우기</div></div>
        <button class="btn ghost sm" id="btnWipe">지우기</button></div>
    </div>

    <div class="ad wide"><span>광고 자리</span></div>
  
  </main>
  <aside class="rail"><div class="ad tall"><span>광고 자리</span></div></aside>
</div>
<script src="assets/lotto-data.js?v=95"></script>
<script src="assets/site.js?v=95"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function row(k,v,c){ return '<tr><td>'+k+(c?'<div class="c">'+c+'</div>':'')+'</td><td>'+v+'</td></tr>'; }
function sumrow(k,v){ return '<tr class="sum"><td>'+k+'</td><td>'+v+'</td></tr>'; }

var L=LOTTO.latest, manual=[];
function renderGrid(){
  var g=$('#gridManual'); g.innerHTML='';
  for(var i=1;i<=45;i++){
    (function(i){
      var b=document.createElement('button');
      b.type='button';
      b.className='pk c'+({c1:1,c2:2,c3:3,c4:4,c5:5}[LOTTO.color(i)]);
      b.textContent=i;
      if(manual.indexOf(i)>-1) b.classList.add('on');
      b.onclick=function(){
        var m=manual.indexOf(i);
        if(m>-1) manual.splice(m,1);
        else { if(manual.length>=6){ U.toast('6개까지 고를 수 있습니다'); return; } manual.push(i); }
        renderGrid();
      };
      g.appendChild(b);
    })(i);
  }
}
function renderList(){
  var my=LOTTO.saved.get(), box=$('#myList');
  $('#mySub').textContent='저장한 뒤에 추첨된 회차와 대조합니다. 아직 추첨 전이면 대기로 표시됩니다.';
  box.innerHTML='';
  if(!my.length){
    box.innerHTML='<div class="emptybox">'+
      '<b>아직 저장한 번호가 없습니다</b>'+
      '<span>편의점에서 산 번호가 있으면 아래 <b>번호 직접 넣기</b>를 열어 넣어 두세요. '+
      '추첨이 끝나면 몇 등인지 자동으로 알려 드립니다.</span>'+
      '<a class="btn sm" href="lotto-gen.html">로또번호 생성기에서 뽑기</a>'+
      '</div>';
    return;
  }
  my.forEach(function(it,idx){
    var savedAt = it.at || 0;
    var done = L.no > savedAt;               /* 저장 이후 추첨이 있었는지 */
    var r = done ? LOTTO.rank(it.n,L.n,L.b) : 0;
    var div=document.createElement('div'); div.className='lrow';
    var bs=document.createElement('div'); bs.className='balls';
    it.n.forEach(function(x){ bs.appendChild(LOTTO.ball(x,'md')); });
    div.appendChild(bs);
    var t=document.createElement('span');
    if(!done){ t.className='tag wait'; t.textContent=(savedAt+1)+'회 대기'; }
    else { t.className='tag'+(r?' hit':''); t.textContent=r?r+'등':'미당첨'; }
    div.appendChild(t);
    var d=document.createElement('button'); d.className='del'; d.textContent='×';
    d.setAttribute('aria-label','삭제');
    d.onclick=function(){ var mm=LOTTO.saved.get(); mm.splice(idx,1); LOTTO.saved.set(mm); renderList(); };
    div.appendChild(d);
    box.appendChild(div);
  });
}
$('#btnSave').onclick=function(){
  if(manual.length!==6){ U.toast('6개를 모두 골라주세요'); return; }
  var n=manual.slice().sort(function(a,b){return a-b;});
  var my=LOTTO.saved.get();
  if(my.some(function(x){return x.n.join(',')===n.join(',');})){ U.toast('이미 저장된 번호입니다'); return; }
  my.unshift({n:n,at:L.no}); LOTTO.saved.set(my.slice(0,50));
  manual=[]; renderGrid(); renderList(); U.toast('저장했습니다');
};
$('#btnClear').onclick=function(){ manual=[]; renderGrid(); };
$('#btnWipe').onclick=function(){
  if(confirm('저장한 번호를 모두 지울까요?')){ LOTTO.saved.set([]); renderList(); U.toast('모두 지웠습니다'); }
};
renderGrid(); renderList();


/* 번호 직접 넣기 — 접었다 펼칩니다 */
(function(){
  var t=document.getElementById('manTog'), sw=document.getElementById('manSw'),
      ac=document.getElementById('manAcc'), open=false;
  if(!t) return;
  t.onclick=function(){
    open=!open;
    sw.classList.toggle('on',open);
    ac.classList.toggle('open',open);
    if(open) setTimeout(function(){
      var r=ac.getBoundingClientRect();
      if(r.top>window.innerHeight*0.45)
        window.scrollTo({top:window.scrollY+r.top-88, behavior:'smooth'});
    },200);
  };
})();
})();
</script>
